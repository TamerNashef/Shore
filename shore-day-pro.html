<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B78">
<title>Shore Day – يوم الشاطئ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EFEE;--surface:#FAFDFC;--ink:#10303A;--muted:#557078;--line:#CFDEDB;--sea:#0F6B78;
  --land:#E2D8BF;--water:#C3DFE3;--chip:#E1ECEA;--green:#23935A;--yellow:#D39A12;--red:#D3442F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0C1B20;--surface:#13272D;--ink:#E3EFEE;--muted:#9AB3B6;--line:#23404A;--sea:#53B3BF;
  --land:#2C3B36;--water:#123A44;--chip:#1B343B;--green:#46B97A;--yellow:#E8B63E;--red:#EE6A55;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0C1B20;--surface:#13272D;--ink:#E3EFEE;--muted:#9AB3B6;--line:#23404A;--sea:#53B3BF;
  --land:#2C3B36;--water:#123A44;--chip:#1B343B;--green:#46B97A;--yellow:#E8B63E;--red:#EE6A55;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
:lang(ar) body,body:lang(ar){font-family:"IBM Plex Sans Arabic","Rubik",system-ui,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 4px}
h1{font-size:1.45rem;font-weight:800;margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.lang{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:999px;min-height:34px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:1.08rem;font-weight:700;margin:0 0 10px}
.sub{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.small{color:var(--muted);font-size:.82rem}
.n{unicode-bidi:isolate;direction:ltr;display:inline-block}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.92rem;border:1px solid var(--line);background:var(--surface)}
.banner.err{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--surface))}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--sea);color:var(--sea);background:transparent;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;color:var(--muted);font-size:.84rem}

/* map */
.mapwrap{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.map svg{width:150px;height:auto;display:block;border-radius:12px;background:var(--water)}
.land{fill:var(--land)} .coast{fill:none;stroke:var(--muted);stroke-width:.8;opacity:.6}
.mk{cursor:pointer} .mk text{font:700 8px Rubik,sans-serif;fill:#fff;pointer-events:none}
.rank{list-style:none;margin:0;padding:0}
.rank li{margin:0}
.rank button{width:100%;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font:inherit;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:7px 2px;min-height:40px;cursor:pointer}
.rank button[aria-current="true"]{background:var(--chip);border-radius:8px}
.rank .dot{width:10px;height:10px;border-radius:50%}
.rank .nm{font-size:.9rem}
.rank .pc{font-weight:700;font-size:.9rem}
.best{display:inline-block;font-size:.7rem;font-weight:700;color:#fff;background:var(--green);border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
.alert{margin-top:10px;border-inline-start:4px solid var(--yellow);background:var(--chip);border-radius:8px;padding:8px 10px;font-size:.88rem}
.alert.red{border-color:var(--red)}

/* score */
.scoreTop{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:118px;height:118px}
.ring .pct{font:800 30px Rubik,sans-serif;fill:var(--ink)}
.ring .lbl{font:600 12px Rubik,sans-serif;fill:var(--muted)}
.where{font-weight:700;font-size:1.05rem}
.when{color:var(--muted);font-size:.9rem}
.verdict{font-size:1.5rem;font-weight:800;line-height:1.15;margin-top:4px}
.bestwin{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:.92rem}
.why h3{font-size:.95rem;margin:14px 0 6px}
.why ul{margin:0;padding:0;list-style:none}
.why li{padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.why li b{font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px}
.fg{font-size:.8rem;color:var(--muted)}
.fg .mb{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:2px}
.fg .mb i{display:block;height:100%}
.warn{margin-top:10px;border:1px solid var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface));border-radius:10px;padding:8px 10px;font-size:.9rem}

/* charts */
.ch{width:100%;height:auto;display:block;direction:ltr}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .hl{font:9px Rubik,sans-serif;fill:var(--muted)}
.ch .dl{font:600 9px Rubik,sans-serif;fill:var(--ink)}
.ch .selb{fill:var(--sea);opacity:.16}
.ch .nowl{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.ch .hit{fill:transparent;cursor:pointer}
.ch .ex{font:700 9px Rubik,sans-serif;fill:var(--ink)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.big strong{font-size:1.7rem;font-weight:800;line-height:1}
.pill{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px;background:var(--c)}
.selinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.88rem}
.arrowrow{margin-top:4px}
.dirnow{display:flex;align-items:center;gap:12px;margin:6px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--chip);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:.78rem;color:var(--muted)}
.kv b{font-size:1.02rem}
.moonTop{display:flex;align-items:center;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.gauge{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 4px}
.gauge div{height:12px;border-radius:4px;opacity:.35}
.gauge div.on{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.gl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.74rem;color:var(--muted);text-align:center}
.fish{border-top:1px solid var(--line);padding:10px 0}
.fish:first-child{border-top:0;padding-top:0}
.fish .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fish b{font-size:.98rem}
.fish i{color:var(--muted);font-size:.8rem}
.fish .bait{font-size:.88rem;margin-top:2px}
.fish .note{font-size:.82rem;color:var(--red)}
.sci p{font-size:.9rem}
[hidden]{display:none!important}
@media (max-width:380px){.mapwrap{grid-template-columns:120px 1fr}.map svg{width:120px}.ring{width:100px;height:100px}}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pl{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="ar">عربي</button><button data-l="he">עברית</button><button data-l="en">EN</button>
    </div>
  </header>
  <p class="tag" id="tag"></p>
  <div id="banner"></div>
  <div class="status"><span id="upd"></span><button class="btn" id="refresh"></button></div>

  <div id="app" hidden>
    <section class="panel">
      <h2 id="tMap"></h2>
      <div class="mapwrap"><div class="map" id="map"></div><ol class="rank" id="rank"></ol></div>
      <div id="alerts"></div>
    </section>

    <section class="panel" id="scorePanel"></section>

    <section class="panel">
      <h2 id="tTimeline"></h2>
      <div class="selinfo"><span id="selLbl"></span><button class="btn" id="backNow"></button></div>
      <div id="timeline" data-chart></div>
      <div class="legend" id="scoreLegend"></div>
    </section>

    <section class="panel" id="moonPanel"></section>
    <section class="panel" id="tidePanel"></section>
    <section class="panel" id="windPanel"></section>
    <section class="panel" id="presPanel"></section>
    <section class="panel" id="wavePanel"></section>
    <section class="panel" id="clarPanel"></section>
    <section class="panel" id="fishPanel"></section>
  </div>
  <section class="panel" id="moonOffline" hidden></section>
  <section class="panel sci" id="sciPanel"></section>
</main>

// ================= astronomy (SunCalc method) =================
const rad=Math.PI/180,dayMs=864e5,J1970=2440588,J2000=2451545,EPS=rad*23.4397;
const toJ=d=>d.valueOf()/dayMs-.5+J1970, fromJ=j=>new Date((j+.5-J1970)*dayMs), toDays=d=>toJ(d)-J2000;
function sunTimes(date,lat,lon){
 const lw=rad*-lon,phi=rad*lat,d=toDays(date),n=Math.round(d-.0009-lw/(2*Math.PI)),ds=.0009+lw/(2*Math.PI)+n;
 const M=rad*(357.5291+.98560028*ds),C=rad*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M)),L=M+C+rad*102.9372+Math.PI;
 const dec=Math.asin(Math.sin(EPS)*Math.sin(L)),Jn=J2000+ds+.0053*Math.sin(M)-.0069*Math.sin(2*L);
 const w=Math.acos((Math.sin(-.833*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
 const a=.0009+(w+lw)/(2*Math.PI)+n,Js=J2000+a+.0053*Math.sin(M)-.0069*Math.sin(2*L);
 return {rise:fromJ(Jn-(Js-Jn)),set:fromJ(Js)};
}
function moonAlt(date,lat,lon){
 const lw=rad*-lon,phi=rad*lat,d=toDays(date);
 const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.229350*d);
 const l=L+rad*6.289*Math.sin(M),b=rad*5.128*Math.sin(F);
 const ra=Math.atan2(Math.sin(l)*Math.cos(EPS)-Math.tan(b)*Math.sin(EPS),Math.cos(l));
 const dec=Math.asin(Math.sin(b)*Math.cos(EPS)+Math.cos(b)*Math.sin(EPS)*Math.sin(l));
 const H=rad*(280.16+360.9856235*d)-lw-ra;
 return Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
}
const SYN=29.530588853;
function moonPhase(t){const jd=t.valueOf()/dayMs+2440587.5;let p=((jd-2451550.1)/SYN)%1;if(p<0)p+=1;return p}
function moonEvents(from,to){
 const ev={rise:[],set:[],over:[],under:[]},step=10*60000,h0=.0023;
 let tP=new Date(from-step),aP=moonAlt(tP,32.1,34.8),tC=new Date(+from),aC=moonAlt(tC,32.1,34.8);
 for(let t=+from+step;t<=+to;t+=step){
  const tN=new Date(t),aN=moonAlt(tN,32.1,34.8);
  if(aP<h0&&aC>=h0)ev.rise.push(tC); if(aP>=h0&&aC<h0)ev.set.push(tC);
  if(aC>aP&&aC>=aN)ev.over.push(tC); if(aC<aP&&aC<=aN)ev.under.push(tC);
  tP=tC;aP=aC;tC=tN;aC=aN;
 }
 return ev;
}
const minDist=(t,arr)=>arr.reduce((m,x)=>Math.min(m,Math.abs(t-x)/6e4),1e9);

async function loadSpot(s){

 const W=getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,precipitation,cloud_cover,weather_code&wind_speed_unit=kmh&${c}`);
 const M=getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${s.slat}&longitude=${s.slon}&hourly=wave_height,wave_direction,wave_period,sea_surface_temperature&${c}`).catch(()=>null);
 const Tl=getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${s.slat}&longitude=${s.slon}&hourly=sea_level_height_msl&${c}`).catch(()=>null);
 const [w,m,t]=await Promise.all([W,M,Tl]);return {w,m,t};
}
function align(times,src,key){
 if(!src||!src.hourly||!src.hourly[key])return times.map(()=>null);
 const idx={};src.hourly.time.forEach((s,i)=>idx[s]=i);
 return times.map(s=>{const i=idx[s];const v=i==null?null:src.hourly[key][i];return v==null?null:v});
}

   store[SPOTS[k].id]={wind:align(ts,w,"wind_speed_10m"),dir:align(ts,w,"wind_direction_10m"),gust:align(ts,w,"wind_gusts_10m"),pres:align(ts,w,"pressure_msl"),
    rain:align(ts,w,"precipitation"),cloud:align(ts,w,"cloud_cover"),code:align(ts,w,"weather_code"),wave:align(ts,m,"wave_height"),wper:align(ts,m,"wave_period"),
    sst:align(ts,m,"sea_surface_temperature"),sea:align(ts,t,"sea_level_height_msl")};});

// ================= scoring =================
function clarityAt(s,i){
 const d=D[s.id];let h=0,r=0;
 for(let k=Math.max(0,i-36);k<=i;k++)h=Math.max(h,d.wave[k]||0);
 for(let k=Math.max(0,i-48);k<=i;k++)r+=d.rain[k]||0;
 const v=h*.9+r/8+s.turb;
 let c=v<.55?0:v<1.15?1:v<1.9?2:3;
 if(S.clarO!=null&&Math.abs(i-NOW)<=12)c=S.clarO;
 return c;
}
function lightAt(i,cloud){
 const t=TIMES[i],st=sunTimes(t,32.1,34.8),m=Math.min(Math.abs(t-st.rise),Math.abs(t-st.set))/6e4;
 if(m<=90)return "golden"; if(t<st.rise||t>st.set)return "night"; return (cloud!=null&&cloud>=70)?"overcast":"day";
}
function evalAt(s,i){
 const d=D[s.id],F={},warns=[];let unsafe=false;
 const wv=d.wave[i];
 if(wv==null)F.waves={p:11,m:22,st:"na"};
 else if(wv<.2)F.waves={p:12,m:22,st:"flat"};else if(wv<.4)F.waves={p:18,m:22,st:"small"};
 else if(wv<=1)F.waves={p:22,m:22,st:"ideal"};else if(wv<=1.3)F.waves={p:14,m:22,st:"rough"};
 else if(wv<=1.7)F.waves={p:6,m:22,st:"high"};else{F.waves={p:0,m:22,st:"danger"};unsafe=true}
 const w=d.wind[i]||0,g=d.gust[i]||0;
 if(w<=12)F.wind={p:13,m:13,st:"calm"};else if(w<=20)F.wind={p:10,m:13,st:"moderate"};else if(w<=30)F.wind={p:6,m:13,st:"fresh"};
 else if(w<=40)F.wind={p:2,m:13,st:"strong"};else{F.wind={p:0,m:13,st:"danger"};unsafe=true}
 if(g>=60)unsafe=true;
 const dir=d.dir[i]||0,diff=Math.abs(((dir-s.sea+540)%360)-180),on=Math.cos(diff*rad);
 if(w<8)F.dir={p:10,m:10,st:"light"};
 else F.dir={p:Math.round(10-7*Math.max(0,on)*Math.min(1,w/25)),m:10,st:on>.5?"onshore":on<-.5?"offshore":"cross"};
 const tr=presTrend(d,i);
 F.pres={p:{fallslow:12,steady:9,riseslow:7,risefast:4,fallfast:6}[tr],m:12,st:tr};
 const lt=lightAt(i,d.cloud[i]);
 F.light={p:{golden:15,night:10,overcast:10,day:6}[lt],m:15,st:lt};
 const t=TIMES[i],ph=moonPhase(t),near=Math.min(ph*SYN,(1-ph)*SYN,Math.abs(ph-.5)*SYN);
 const major=minDist(t,MOON.over.concat(MOON.under))<=60,minor=minDist(t,MOON.rise.concat(MOON.set))<=30;
 F.moon={p:(near<=3?4:2)+(major?6:minor?4:1),m:10,st:major?"major":minor?"minor":"none",peak:near<=3};
 const c=clarityAt(s,i);
 F.clar={p:[6,10,7,2][c],m:10,st:["clear","slight","murky","muddy"][c],lvl:c};
 const sea=d.sea;
 if(sea[i]==null)F.tide={p:3,m:5,st:"na"};
 else{let mx=0;for(let k=Math.max(1,i-24);k<Math.min(sea.length-1,i+24);k++)if(sea[k+1]!=null&&sea[k-1]!=null)mx=Math.max(mx,Math.abs(sea[k+1]-sea[k-1]));
  const r=(sea[i+1]!=null&&sea[i-1]!=null)?Math.abs(sea[i+1]-sea[i-1]):0;
  F.tide=(mx>0&&r>.35*mx)?{p:5,m:5,st:"moving"}:{p:2,m:5,st:"slack"}}
 const sst=d.sst[i];
 F.sst=sst==null?{p:2,m:3,st:"na"}:(sst>=16&&sst<=28?{p:3,m:3,st:"ok"}:{p:1,m:3,st:"off"});
 if(d.code[i]!=null&&d.code[i]>=95)unsafe=true;
 let total=Object.values(F).reduce((a,f)=>a+f.p,0);
 total=Math.max(0,Math.min(100,total));
 return {total,F,unsafe};
}
function presTrend(d,i){
 const p=d.pres;if(i<3||p[i]==null||p[i-3]==null)return "steady";

}

const level=v=>v>=70?3:v>=55?2:v>=40?1:0;

const BW=6;
function axis(start,end,H,bot){
 let s="";
 for(let i=start;i<=end;i++){const x=(i-start)*BW,h=hourOf(TIMES[i]);
  if(h===0){s+=`<line x1="${x}" x2="${x}" y1="4" y2="${H-bot}" class="grid"/><text x="${x+2}" y="${H-3}" class="dl">${esc(fmtD(TIMES[i]))}</text>`}
  else if(h%6===0)s+=`<text x="${x+BW/2}" y="${H-12}" class="hl" text-anchor="middle">${String(h).padStart(2,"0")}</text>`}
 return s;
}
function marks(start,end,H,bot){
 let s="";
 if(S.sel>=start&&S.sel<=end)s+=`<rect class="selb" x="${(S.sel-start)*BW}" y="0" width="${BW}" height="${H-bot}"/>`;
 if(NOW>=start&&NOW<=end)s+=`<line class="nowl" x1="${(NOW-start)*BW+BW/2}" x2="${(NOW-start)*BW+BW/2}" y1="0" y2="${H-bot}"/>`;
 for(let i=start;i<=end;i++)s+=`<rect class="hit" data-i="${i}" x="${(i-start)*BW}" y="0" width="${BW}" height="${H}"/>`;
 return s;
}
function win(){const start=NOW,end=Math.min(TIMES.length-1,NOW+71);return [start,end]}
function barChart(vals,min,max,colorFn,H=120){
 const [a,b]=win(),W=(b-a+1)*BW,bot=24,ph=H-bot-6;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}">`+axis(a,b,H,bot);
 for(let i=a;i<=b;i++){const v=vals[i];if(v==null)continue;const hh=Math.max(1,(Math.min(max,Math.max(min,v))-min)/(max-min)*ph);
  s+=`<rect x="${(i-a)*BW+.6}" y="${H-bot-hh}" width="${BW-1.2}" height="${hh}" rx="1" fill="${col(colorFn(v,i))}"/>`}
 return s+marks(a,b,H,bot)+"</svg>";
}
function lineChart(vals,min,max,colorFn,H=120,extra=""){
 const [a,b]=win(),W=(b-a+1)*BW,bot=24,ph=H-bot-14,y=v=>H-bot-(Math.min(max,Math.max(min,v))-min)/(max-min)*ph;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}">`+axis(a,b,H,bot),pts=[];
 for(let i=a;i<=b;i++)if(vals[i]!=null)pts.push(`${(i-a)*BW+BW/2},${y(vals[i]).toFixed(1)}`);
 s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.2"/>`;
 for(let i=a;i<=b;i+=2)if(vals[i]!=null)s+=`<circle cx="${(i-a)*BW+BW/2}" cy="${y(vals[i])}" r="2.2" fill="${col(colorFn(vals[i],i))}"/>`;

}

 $("tMap").textContent=tx().map;
 $("rank").innerHTML=SPOTS.filter(sp=>R[sp.id]).map(sp=>{const r=R[sp.id],c=r.unsafe?"red":scoreCol(r.total);
  return `<li><button data-s="${sp.id}" aria-current="${sp.id===S.spot}"><span class="dot" style="background:${col(c)}"></span><span class="nm">${esc(nm(sp))}${sp.id===best?`<span class="best">${tx().bestNow}</span>`:""}</span><span class="pc">${r.unsafe?"⚠":r.total+"%"}</span></button></li>`}).join("");
 // alerts
 let al="";const safe=ids.filter(k=>!R[k].unsafe);
 if(safe.length>1){const worst=safe.reduce((a,b)=>R[b].total<R[a].total?b:a,safe[0]);
  if(R[best].total-R[worst].total>=15){let fk="waves",md=-1;Object.keys(R[best].F).forEach(k=>{const df=R[best].F[k].p-R[worst].F[k].p;if(df>md){md=df;fk=k}});
   al+=`<div class="alert">${esc(tx().diff(nm(SPOTS.find(s=>s.id===best)),nm(SPOTS.find(s=>s.id===worst)),tx().fn[fk]))}</div>`}}
 ids.filter(k=>R[k].unsafe).forEach(k=>al+=`<div class="alert red">${esc(tx().unsafeAt(nm(SPOTS.find(s=>s.id===k))))}</div>`);
 $("alerts").innerHTML=al;
}
function ring(v,c){
 const r=48,C=2*Math.PI*r,off=C*(1-v/100);
 return `<svg class="ring" viewBox="0 0 118 118"><circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--chip)" stroke-width="12"/><circle cx="59" cy="59" r="${r}" fill="none" stroke="${col(c)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 59 59)"/><text x="59" y="64" text-anchor="middle" class="pct">${v}%</text><text x="59" y="82" text-anchor="middle" class="lbl"></text></svg>`;
}
function renderScore(spot,r){
 const t=TIMES[S.sel],c=r.unsafe?"red":scoreCol(r.total);
 const verdict=r.unsafe?tx().danger:tx().lv[level(r.total)];
 // best window next 48h
 let bi=NOW,bv=-1;for(let k=NOW;k<=Math.min(TIMES.length-2,NOW+48);k++){const e=evalAt(spot,k);if(!e.unsafe){const v=(e.total+evalAt(spot,k+1).total)/2;if(v>bv){bv=v;bi=k}}}
 const ups=[],downs=[];
 Object.entries(r.F).forEach(([k,f])=>{if(f.st==="na")return;const q=f.p/f.m;let txt=fx(k,f.st);if(k==="moon"&&f.peak)txt+=fx("moon","peak");
  const li=`<li><b>${esc(tx().fN[k])}:</b> ${esc(txt)}</li>`;if(q>=.75)ups.push([q,li]);else if(q<=.5)downs.push([q,li])});
 ups.sort((a,b)=>b[0]-a[0]);downs.sort((a,b)=>a[0]-b[0]);
 const fg=Object.entries(r.F).map(([k,f])=>{const q=f.p/f.m;return `<div class="fg">${esc(tx().fN[k])} <b style="color:var(--ink)">${f.p}/${f.m}</b><div class="mb"><i style="width:${Math.round(q*100)}%;background:${col(q>=.7?"green":q>=.45?"yellow":"red")}"></i></div></div>`}).join("");
 $("scorePanel").innerHTML=`<div class="scoreTop">${ring(r.total,c)}<div><div class="where">${esc(nm(spot))}</div><div class="when">${S.sel===NOW?tx().now:esc(fmtDT(t))} · ${tx().chance}</div><div class="verdict" style="color:${col(c)}">${esc(verdict)}</div></div></div>
 ${r.unsafe?`<div class="warn">${esc(tx().danger)}</div>`:""}
 <div class="bestwin">${tx().bestWin}: <b>${esc(fmtD(TIMES[bi]))} <span class="n">${esc(fmtT(TIMES[bi]))}–${esc(fmtT(new Date(+TIMES[bi]+2*36e5)))}</span></b> <span class="n">(${Math.round(bv)}%)</span></div>
 <div class="why">${ups.length?`<h3 style="color:${col("green")}">▲ ${tx().up}</h3><ul>${ups.map(x=>x[1]).join("")}</ul>`:""}${downs.length?`<h3 style="color:${col("red")}">▼ ${tx().down}</h3><ul>${downs.map(x=>x[1]).join("")}</ul>`:""}</div>
 <h3 style="font-size:.95rem;margin:14px 0 0">${tx().factors}</h3><div class="fgrid">${fg}</div>`;
}
function renderTimeline(spot){
 $("tTimeline").textContent=tx().timeline;$("backNow").textContent=tx().backNow;$("backNow").hidden=S.sel===NOW;
 $("selLbl").innerHTML=`${tx().showing}: <b>${S.sel===NOW?tx().now:esc(fmtDT(TIMES[S.sel]))}</b>`;
 const vals=TIMES.map((_,i)=>{const e=evalAt(spot,i);return e.unsafe?3:e.total});
 $("timeline").innerHTML=barChart(vals,0,100,(v)=>v<=3?"red":scoreCol(v),130);
 $("scoreLegend").innerHTML=`<span style="--c:var(--green)" class="n">≥ 60%</span><span style="--c:var(--yellow)" class="n">40–59%</span><span style="--c:var(--red)" class="n">&lt; 40%</span>`;
}
function moonDraw(p,size){
 const r=size/2-2,c=size/2,k=Math.cos(2*Math.PI*p),rx=Math.abs(k)*r,wax=p<.5;
 const sweep=wax?1:0,bulge=k<0?(wax?1:0):(wax?0:1);
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="var(--chip)" stroke="var(--line)"/><path d="M${c} ${c-r} A${r} ${r} 0 0 ${sweep} ${c} ${c+r} A${rx} ${r} 0 0 ${bulge} ${c} ${c-r} Z" fill="#F1D98A"/></svg>`;
}
function moonHTML(t){
 const p=moonPhase(t),ill=Math.round((1-Math.cos(2*Math.PI*p))/2*100),name=tx().phases[Math.floor((p*8+.5)%8)];
 const toFull=((.5-p+1)%1)*SYN,toNew=((1-p)%1)*SYN,st=sunTimes(t,32.1,34.8);
 let list="";
 if(MOON){const evs=[];const end=+t+48*36e5;
  [["over",tx().over],["under",tx().under],["rise",tx().rise],["set",tx().set]].forEach(([k,l])=>MOON[k].forEach(x=>{if(+x>=+t&&+x<=end)evs.push([x,l,k])}));
  evs.sort((a,b)=>a[0]-b[0]);
  list=`<h3 style="font-size:.92rem;margin:12px 0 6px">${tx().moonNext}</h3><div class="cols">${evs.map(([x,l,k])=>`<div class="kv" style="${k==="over"||k==="under"?"border-inline-start:4px solid var(--green)":""}"><span>${esc(l)}</span><b>${esc(fmtD(x))} ${esc(fmtT(x))}</b></div>`).join("")}</div>`}
 return `<h2>${tx().moon}</h2><div class="moonTop">${moonDraw(p,72)}<div><div class="big"><strong>${esc(name)}</strong></div><div class="small">${tx().lit}: <b>${ill}%</b> · ${tx().full} ${Math.round(toFull)} ${tx().days} · ${tx().newm} ${Math.round(toNew)} ${tx().days}</div><div class="small">${tx().sun}: <b>${esc(fmtT(st.rise))}</b> / <b>${esc(fmtT(st.set))}</b></div></div></div>${list}`;
}
function renderMoon(i){$("moonPanel").innerHTML=moonHTML(TIMES[i])}
function renderOffline(){
 const now=new Date();MOON=moonEvents(new Date(+now-dayMs),new Date(+now+3*dayMs));
 $("moonOffline").hidden=false;$("moonOffline").innerHTML=moonHTML(now);
}
function renderTide(spot,d,i){
 const sea=d.sea;
 if(sea[i]==null){$("tidePanel").innerHTML=`<h2>${tx().tide}</h2><p class="small">${tx().tideNA}</p>`;return}
 const rising=sea[i+1]!=null?sea[i+1]>=sea[i]:sea[i]>=sea[i-1];
 const [a,b]=win();let nh=null,nl=null,ex="";
 const vals=sea.filter(v=>v!=null),mn=Math.min(...vals)-.03,mx=Math.max(...vals)+.03,H=130,bot=24,ph=H-bot-14,y=v=>H-bot-(v-mn)/(mx-mn)*ph;
 for(let k=Math.max(1,a);k<Math.min(sea.length-1,b);k++){if(sea[k]==null||sea[k-1]==null||sea[k+1]==null)continue;
  const hi=sea[k]>sea[k-1]&&sea[k]>=sea[k+1],lo=sea[k]<sea[k-1]&&sea[k]<=sea[k+1];
  if(hi||lo){ex+=`<text class="ex" x="${(k-a)*BW+BW/2}" y="${hi?y(sea[k])-5:y(sea[k])+11}" text-anchor="middle">${hi?"▲":"▼"}${esc(fmtT(TIMES[k]))}</text>`;
   if(k>i){if(hi&&!nh)nh=TIMES[k];if(lo&&!nl)nl=TIMES[k]}}}
 let area=`<polygon points="${(()=>{let p=[];for(let k=a;k<=b;k++)if(sea[k]!=null)p.push(`${(k-a)*BW+BW/2},${y(sea[k]).toFixed(1)}`);return `0,${H-bot} ${p.join(" ")} ${(b-a)*BW+BW/2},${H-bot}`})()}" fill="var(--sea)" opacity=".18"/>`;
 const W=(b-a+1)*BW;let s=`<svg class="ch" viewBox="0 0 ${W} ${H}">`+axis(a,b,H,bot)+area;
 let pts=[];for(let k=a;k<=b;k++)if(sea[k]!=null)pts.push(`${(k-a)*BW+BW/2},${y(sea[k]).toFixed(1)}`);
 s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--sea)" stroke-width="2"/>`+ex+marks(a,b,H,bot)+"</svg>";
 $("tidePanel").innerHTML=`<h2>${tx().tide}</h2><div class="big"><strong>${rising?"↑ "+tx().rising:"↓ "+tx().falling}</strong><span class="small n">${Math.round(sea[i]*100)} cm</span></div>
 <div class="cols" style="margin-bottom:8px">${nh?`<div class="kv"><span>${tx().nextHigh}</span><b>${esc(fmtDT(nh))}</b></div>`:""}${nl?`<div class="kv"><span>${tx().nextLow}</span><b>${esc(fmtDT(nl))}</b></div>`:""}</div>
 <div data-chart>${s}</div><p class="small" style="margin-top:8px">${tx().tideNote}</p>`;
}
function renderWind(spot,d,i){
 const w=d.wind[i]||0,g=d.gust[i]||0,dir=d.dir[i]||0,c=windC(w),lb=tx().windL[c==="green"?0:c==="yellow"?1:2];
 const diff=Math.abs(((dir-spot.sea+540)%360)-180),on=Math.cos(diff*rad),rel=on>.5?tx().onshore:on<-.5?tx().offshore:tx().cross;
 let mx=0,sx=0,sy=0;for(let k=i;k<=Math.min(TIMES.length-1,i+24);k++){mx=Math.max(mx,d.wind[k]||0);sx+=(d.wind[k]||0)*Math.sin((d.dir[k]||0)*rad);sy+=(d.wind[k]||0)*Math.cos((d.dir[k]||0)*rad)}
 const dom=(Math.atan2(sx,sy)/rad+360)%360;
 $("windPanel").innerHTML=`<h2>${tx().windT}</h2>
 <div class="big"><strong class="n">${Math.round(w)} km/h</strong><span class="pill" style="background:${col(c)}">${lb}</span><span class="small">${tx().gust}: <span class="n">${Math.round(g)} km/h</span></span></div>
 <div class="dirnow">${arrowSVG(dir,54,col(c))}<div><div><b>${tx().from} ${esc(dirName(dir))}</b> (${Math.round(dir)}°)</div><div class="small">${esc(rel)}</div></div></div>
 <div data-chart>${barChart(d.wind,0,50,v=>windC(v))}${arrowRow(d)}</div>
 <div class="legend"><span style="--c:var(--green)">${tx().windL[0]} <b class="n">&lt; 15 km/h</b></span><span style="--c:var(--yellow)">${tx().windL[1]} <b class="n">15–30 km/h</b></span><span style="--c:var(--red)">${tx().windL[2]} <b class="n">&gt; 30 km/h</b></span></div>
 <p class="small" style="margin-top:6px">${tx().next24}: ${tx().maxW} <b class="n">${Math.round(mx)} km/h</b>${S.lang==="ar"?"،":","} ${tx().mostly} <b>${esc(dirName(dom))}</b></p>`;
}
function renderPres(d,i){
 const p=d.pres[i];if(p==null){$("presPanel").innerHTML="";return}
 const c=presC(p),lb=tx().presL[c==="yellow"?0:c==="green"?1:2],tr=presTrend(d,i);
 const [a,b]=win(),vals=d.pres.slice(a,b+1).filter(v=>v!=null),mn=Math.min(...vals,1006)-1,mx=Math.max(...vals,1022)+1;
 $("presPanel").innerHTML=`<h2>${tx().pres}</h2>
 <div class="big"><strong class="n">${Math.round(p)} hPa</strong><span class="pill" style="background:${col(c)}">${lb}</span><span class="small">${tr.startsWith("fall")?"↘":tr.startsWith("rise")?"↗":"→"} ${esc(tx().trend[tr])}</span></div>
 <div data-chart>${lineChart(d.pres,mn,mx,v=>presC(v))}</div>
 <div class="legend"><span style="--c:var(--yellow)">${tx().presL[0]} <b class="n">&lt; 1009 hPa</b></span><span style="--c:var(--green)">${tx().presL[1]} <b class="n">1009–1019 hPa</b></span><span style="--c:var(--red)">${tx().presL[2]} <b class="n">≥ 1020 hPa</b></span></div>
 <p class="small" style="margin-top:6px">${esc(fx("pres",tr))}</p>`;
}
function renderWaves(d,i){
 const v=d.wave[i];if(v==null){$("wavePanel").innerHTML=`<h2>${tx().waves}</h2><p class="small">${fx("waves","na")}</p>`;return}
 const c=waveC(v),lb=tx().waveL[v>=1.3?2:v>=.5?1:0],sst=d.sst[i],per=d.wper[i];
 $("wavePanel").innerHTML=`<h2>${tx().waves}</h2>
 <div class="big"><strong class="n">${v.toFixed(1)} m</strong><span class="pill" style="background:${col(c)}">${lb}</span>${per!=null?`<span class="small">${tx().period}: <span class="n">${per.toFixed(0)} s</span></span>`:""}${sst!=null?`<span class="small">${tx().sst}: <span class="n">${sst.toFixed(1)}°C</span></span>`:""}</div>
 <div data-chart>${barChart(d.wave,0,2.5,x=>waveC(x))}</div>
 <div class="legend"><span style="--c:var(--green)">${tx().waveL[0]} / ${tx().waveL[1]} <b class="n">&lt; 1.3 m</b></span><span style="--c:var(--red)">${tx().waveL[2]} <b class="n">≥ 1.3 m</b></span></div>`;
}
function renderClar(spot,i){
 const c=clarityAt(spot,i),cols=["yellow","green","yellow","red"];
 $("clarPanel").innerHTML=`<h2>${tx().clar}</h2>
 <div class="big"><strong>${esc(tx().clarL[c])}</strong><span class="pill" style="background:${col(cols[c])}">${c===1?"✓":c===3?"✕":"~"}</span></div>
 <div class="gauge">${cols.map((cc,k)=>`<div class="${k===c?"on":""}" style="background:${col(cc)}"></div>`).join("")}</div>
 <div class="gl">${tx().clarL.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
 <p class="small" style="margin-top:8px">${esc(fx("clar",["clear","slight","murky","muddy"][c]))}</p>
 <p class="small">${tx().clarEst}</p>
 <div class="chips" id="clarChips"><button class="chip" data-c="" aria-pressed="${S.clarO==null}">${tx().auto}</button>${tx().clarL.map((x,k)=>`<button class="chip" data-c="${k}" aria-pressed="${S.clarO===k}">${esc(x)}</button>`).join("")}</div>`;
}
function renderFish(spot,d,i,r){
 const t=TIMES[i],mo=Number(monthF.format(t)),sst=d.sst[i],wv=d.wave[i]==null?.6:d.wave[i],cl=r.F.clar.lvl,lt=r.F.light.st,L=LI[S.lang];
 const fit=FISH.map(f=>{let s=f.m.includes(mo)?40:f.all?22:5;
  s+=sst==null?8:(sst>=f.sst[0]&&sst<=f.sst[1]?15:3);
  s+=f.wave==="rough"?((wv>=.5&&wv<=1.4)?12:4):f.wave==="calm"?(wv<.6?12:3):(wv<=1.2?10:4);
  s+=f.water==="murky"?((cl===1||cl===2)?10:3):f.water==="clear"?((cl<=1)?10:3):7;
  s+=f.light.includes(lt)?8:3; s+=f.hab.some(h=>spot.hab.includes(h))?15:2;
  return [Math.min(100,s),f]}).sort((a,b)=>b[0]-a[0]).slice(0,6);
 $("fishPanel").innerHTML=`<h2>${tx().fish}</h2>`+fit.map(([s,f])=>`<div class="fish"><div class="top"><b>${esc(f.n[L])} <i>${esc(f.sci)}</i></b><span class="pill" style="background:${col(scoreCol(s))}">${tx().match} ${s}%</span></div><div class="bait">🎣 ${tx().bait}: ${esc(f.b[L])}</div>${f.note?`<div class="note">⚠ ${esc(f.note[L])}</div>`:""}</div>`).join("");
}
function renderSci(){$("sciPanel").innerHTML=`<h2>${tx().sciT}</h2>`+tx().sci.map((p,k)=>`<p class="${k>=7?"small":""}">${esc(p)}</p>`).join("")}

// ================= events =================
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.lang=b.dataset.l;ss("sdp-lang",S.lang);
 if(LOADED&&LOADED.cached)$("banner").innerHTML=`<div class="banner">${tx().cached} ${fmtDT(new Date(LOADED.at))}</div>`;
 else if(!LOADED&&$("banner").innerHTML)$("banner").innerHTML=`<div class="banner err">${tx().err}</div>`;
 render()});
document.addEventListener("click",e=>{
 const sp=e.target.closest("[data-s]");if(sp){S.spot=sp.dataset.s;ss("sdp-spot",S.spot);render();return}
 const h=e.target.closest("[data-i]");if(h){S.sel=+h.dataset.i;render();return}
 const c=e.target.closest("#clarChips [data-c]");if(c){S.clarO=c.dataset.c===""?null:+c.dataset.c;render();return}
});
$("backNow").onclick=()=>{S.sel=NOW;render()};
$("refresh").onclick=()=>loadAll();
render();loadAll();
</script>
</body>
