<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shore Day">
<title>Shore Day – يوم الشاطئ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#E7EFEE;--surface:#FAFDFC;--ink:#10303A;--muted:#557078;--line:#CFDEDB;--sea:#0F6B78;
  --land:#E2D8BF;--water:#C3DFE3;--chip:#E1ECEA;--green:#23935A;--yellow:#D39A12;--red:#D3442F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0C1B20;--surface:#13272D;--ink:#E3EFEE;--muted:#9AB3B6;--line:#23404A;--sea:#53B3BF;
  --land:#2C3B36;--water:#123A44;--chip:#1B343B;--green:#46B97A;--yellow:#E8B63E;--red:#EE6A55;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0C1B20;--surface:#13272D;--ink:#E3EFEE;--muted:#9AB3B6;--line:#23404A;--sea:#53B3BF;
  --land:#2C3B36;--water:#123A44;--chip:#1B343B;--green:#46B97A;--yellow:#E8B63E;--red:#EE6A55;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
:lang(ar) body,body:lang(ar){font-family:"IBM Plex Sans Arabic","Rubik",system-ui,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto;padding:12px 14px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 4px}
h1{font-size:1.45rem;font-weight:800;margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.lang{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:999px;min-height:34px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:1.08rem;font-weight:700;margin:0 0 10px}
.sub{color:var(--muted);font-size:.86rem;margin:0 0 8px}
.small{color:var(--muted);font-size:.82rem}
.n{unicode-bidi:isolate;direction:ltr;display:inline-block}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.92rem;border:1px solid var(--line);background:var(--surface)}
.banner.err{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--surface))}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--sea);color:var(--sea);background:transparent;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;color:var(--muted);font-size:.84rem}

/* map */
.mapwrap{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.map svg{width:150px;height:auto;display:block;border-radius:12px;background:var(--water)}
.land{fill:var(--land)} .coast{fill:none;stroke:var(--muted);stroke-width:.8;opacity:.6}
.mk{cursor:pointer} .mk text{font:700 8px Rubik,sans-serif;fill:#fff;pointer-events:none}
.rank{list-style:none;margin:0;padding:0}
.rank li{margin:0}
.rank button{width:100%;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font:inherit;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:7px 2px;min-height:40px;cursor:pointer}
.rank button[aria-current="true"]{background:var(--chip);border-radius:8px}
.rank .dot{width:10px;height:10px;border-radius:50%}
.rank .nm{font-size:.9rem}
.rank .pc{font-weight:700;font-size:.9rem}
.best{display:inline-block;font-size:.7rem;font-weight:700;color:#fff;background:var(--green);border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
.alert{margin-top:10px;border-inline-start:4px solid var(--yellow);background:var(--chip);border-radius:8px;padding:8px 10px;font-size:.88rem}
.alert.red{border-color:var(--red)}

/* score */
.scoreTop{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:118px;height:118px}
.ring .pct{font:800 30px Rubik,sans-serif;fill:var(--ink)}
.ring .lbl{font:600 12px Rubik,sans-serif;fill:var(--muted)}
.where{font-weight:700;font-size:1.05rem}
.when{color:var(--muted);font-size:.9rem}
.verdict{font-size:1.5rem;font-weight:800;line-height:1.15;margin-top:4px}
.bestwin{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:.92rem}
.why h3{font-size:.95rem;margin:14px 0 6px}
.why ul{margin:0;padding:0;list-style:none}
.why li{padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.why li b{font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px}
.fg{font-size:.8rem;color:var(--muted)}
.fg .mb{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:2px}
.fg .mb i{display:block;height:100%}
.warn{margin-top:10px;border:1px solid var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface));border-radius:10px;padding:8px 10px;font-size:.9rem}

/* charts */
.ch{width:100%;height:auto;display:block;direction:ltr}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .hl{font:9px Rubik,sans-serif;fill:var(--muted)}
.ch .dl{font:600 9px Rubik,sans-serif;fill:var(--ink)}
.ch .selb{fill:var(--sea);opacity:.16}
.ch .nowl{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.ch .hit{fill:transparent;cursor:pointer}
.ch .ex{font:700 9px Rubik,sans-serif;fill:var(--ink)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.big strong{font-size:1.7rem;font-weight:800;line-height:1}
.pill{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px;background:var(--c)}
.selinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.88rem}
.arrowrow{margin-top:4px}
.dirnow{display:flex;align-items:center;gap:12px;margin:6px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--chip);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:.78rem;color:var(--muted)}
.kv b{font-size:1.02rem}
.moonTop{display:flex;align-items:center;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.gauge{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 4px}
.gauge div{height:12px;border-radius:4px;opacity:.35}
.gauge div.on{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.gl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.74rem;color:var(--muted);text-align:center}
.fish{border-top:1px solid var(--line);padding:10px 0}
.fish:first-child{border-top:0;padding-top:0}
.fish .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fish b{font-size:.98rem}
.fish i{color:var(--muted);font-size:.8rem}
.fish .bait{font-size:.88rem;margin-top:2px}
.fish .note{font-size:.82rem;color:var(--red)}
.sci p{font-size:.9rem}
.lmap{height:360px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--water)}
.lmkicon{background:none;border:0}
.lmkw{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.lmk{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px Rubik,sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.lmk.sel{width:36px;height:36px;border:3px solid #FFE27A}
.lmk.best{box-shadow:0 0 0 5px rgba(70,185,122,.65),0 1px 4px rgba(0,0,0,.55)}
.lmk.mine{border-radius:9px}
.maptools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.msg{font-size:.88rem;margin:6px 0 10px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.msg .btn{margin-top:6px}
.form{display:grid;gap:10px;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:12px}
.form label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.form input,.form select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.solid{background:var(--sea);border-color:var(--sea);color:#fff}
.mapwrap.noSvg{grid-template-columns:1fr}
.mapwrap.noSvg .map{display:none}
.trip{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border-top:1px solid var(--line);padding:9px 0}
.trip .meta{font-size:.8rem;color:var(--muted)}
.del{font:inherit;font-size:.8rem;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;min-height:36px}
.ins{border-top:1px solid var(--line);padding:7px 0;display:grid;grid-template-columns:1fr auto;gap:8px;font-size:.9rem;align-items:center}
.ins span{color:var(--muted);font-size:.82rem}
.tune{margin-top:10px;font-size:.88rem;padding:8px 10px;border-radius:10px;border:1px dashed var(--sea)}
#logPanel h3{font-size:.95rem;margin:14px 0 6px}
.leaflet-container{font:inherit}
.rig{border-top:1px solid var(--line);padding:2px 0}
.rig summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
.rig summary::-webkit-details-marker{display:none}
.rig summary::after{content:"+";color:var(--muted);font-weight:400}
.rig[open] summary::after{content:"−"}
.rig svg{width:100%;max-width:380px;height:auto;display:block;margin:2px auto 8px;direction:ltr}
.rig .rl{font-size:11px;fill:var(--ink)}
.rig ol{margin:0 0 8px;padding-inline-start:20px;font-size:.9rem}
.rig li{margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.tbl td:last-child{text-align:end;font-weight:700;white-space:nowrap}
.tbl i{color:var(--muted);font-size:.76rem}
.rules ul{padding-inline-start:18px;margin:0}
.rules li{margin-bottom:6px;font-size:.9rem}
.rnote{margin-top:10px;border-inline-start:4px solid var(--red);background:var(--chip);border-radius:8px;padding:8px 10px;font-size:.88rem}
.rmk{width:26px;height:26px;border-radius:50%;background:#C0392B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;display:block;margin-top:6px;background:var(--chip)}
.phprev{max-width:110px;border-radius:8px;display:block;margin-top:6px}
.sizemsg{font-size:.84rem;margin-top:4px}
.tripbtns{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.linkbtn{font:inherit;font-size:inherit;background:none;border:0;color:var(--sea);text-decoration:underline;padding:4px 0;cursor:pointer}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;width:100%}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.sharebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#viewer{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#viewer[hidden]{display:none}
#viewer img{max-width:100%;max-height:72vh;border-radius:10px}
#viewer .vb{display:flex;gap:10px;margin-top:14px}
#viewer .btn{color:#fff;border-color:#fff;background:transparent}
.fishpic{display:block;max-width:100%;height:auto}
.fish{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:start}
.fish .pic{padding-top:2px}
.fg2{border-top:1px solid var(--line);padding:14px 0}
.fg2 .pic{max-width:300px;margin:0 auto 8px}
.fg2 h3{margin:0 0 2px;font-size:1.02rem}
.fg2 h3 i{color:var(--muted);font-size:.8rem;font-weight:400}
.fg2 .id{font-size:.92rem;margin:6px 0}
.fg2 .small{margin-top:2px}
.fg2 .note{font-size:.84rem;color:var(--red);margin-top:4px}
.fg2 a{color:var(--sea)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;max-width:160px;font:inherit;font-size:.78rem;font-weight:600;background:none;border:0;color:var(--muted);padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.tabbar button span{font-size:1.3rem;line-height:1}
.tabbar button[aria-selected="true"]{color:var(--sea);box-shadow:inset 0 3px 0 var(--sea)}
body[data-tab="today"] [data-tab]:not([data-tab="today"]),body[data-tab="map"] [data-tab]:not([data-tab="map"]),body[data-tab="log"] [data-tab]:not([data-tab="log"]),body[data-tab="guide"] [data-tab]:not([data-tab="guide"]){display:none}
.spotbar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.spotbar label{font-size:.85rem;color:var(--muted);white-space:nowrap}
.spotbar select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px}
#fishPic{margin-top:6px;max-width:130px}
[hidden]{display:none!important}
@media (max-width:380px){.mapwrap{grid-template-columns:120px 1fr}.map svg{width:120px}.ring{width:100px;height:100px}}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pl{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="ar">عربي</button><button data-l="he">עברית</button><button data-l="en">EN</button>
    </div>
  </header>
  <p class="tag" id="tag"></p>
  <div id="banner"></div>
  <div id="installCard"></div>
  <div class="status"><span id="upd"></span><button class="btn" id="refresh"></button></div>

  <div id="app" hidden>
    <section class="panel" data-tab="map">
      <h2 id="tMap"></h2>
      <div id="lmap" class="lmap" dir="ltr" hidden></div>
      <div class="maptools"><button class="btn" id="gpsBtn"></button><button class="btn" id="addSpotBtn"></button><button class="btn" id="layerBtn" hidden></button></div>
      <p class="small" id="resLegend" style="margin:0 0 8px"></p><div id="mapMsg"></div><div id="spotForm"></div>
      <div class="mapwrap" id="mapwrap"><div class="map" id="map"></div><ol class="rank" id="rank"></ol></div>
      <div id="spotDel"></div>
      <div id="alerts"></div>
    </section>

    <div class="panel spotbar" data-tab="today"><label for="spotSel" id="spotSelL"></label><select id="spotSel"></select></div>
    <section class="panel" id="scorePanel" data-tab="today"></section>

    <section class="panel" data-tab="today">
      <h2 id="tTimeline"></h2>
      <div class="selinfo"><span id="selLbl"></span><button class="btn" id="backNow"></button></div>
      <div id="timeline" data-chart></div>
      <div class="legend" id="scoreLegend"></div>
    </section>

    <section class="panel" id="logPanel" data-tab="log"></section>
    <section class="panel" id="moonPanel" data-tab="today"></section>
    <section class="panel" id="tidePanel" data-tab="today"></section>
    <section class="panel" id="windPanel" data-tab="today"></section>
    <section class="panel" id="presPanel" data-tab="today"></section>
    <section class="panel" id="wavePanel" data-tab="today"></section>
    <section class="panel" id="clarPanel" data-tab="today"></section>
    <section class="panel" id="fishPanel" data-tab="today"></section>
    <section class="panel" id="fishGuide" data-tab="guide"></section>
    <section class="panel" id="rigPanel" data-tab="guide"></section>
    <section class="panel" id="rulesPanel" data-tab="guide"></section>
  </div>
  <section class="panel" id="moonOffline" hidden></section>
  <section class="panel sci" id="sciPanel" data-tab="guide"></section>
</main>
<nav class="tabbar" id="tabbar" role="tablist" hidden></nav>
<div id="viewer" hidden></div>

 "Waves (22 points): Inshore sea bass catches fell as wave height rose (Watson et al., 2022). A South African surf-zone study found fish move into breaking waves for cover when the water is a bit murky – so light white water scores best.",
 "Light (15): In lake studies, time of day mattered more than the moon. Dawn, dusk and cloudy hours score highest.",
 "Wind (13 + 10) and pressure (12): Wind speed and direction affected catches in a long-term creel study. For pressure the trend matters more than the number, but proof in the sea is weak – so it has a medium weight.",
 "Moon (10): Real but small – about 5% more fish around full and new moon in a study of 340,000+ catches (Vinson & Angradi, 2014). Moon overhead/underfoot periods helped in a long-term lake study (2021).",
 "Water clarity (10), tide (5), sea temperature (3): Slightly murky water is best near shore. Israel’s tide is only a few tens of cm, so it counts for little.",
 "Live data: Open-Meteo weather and marine forecasts. Moon and sun are calculated in the app.",
 "Fishing is not allowed in marine nature reserves or during some breeding seasons. Respect minimum sizes and local signs."],

const PROF={deep:[[0,.04],[.025,.36],[.07,.6],[.18,.88],[.36,1],[.56,.9],[.76,.55],[.91,.25],[1,.19]],
 torp:[[0,.05],[.025,.4],[.07,.64],[.2,.93],[.38,1],[.6,.86],[.8,.5],[.93,.25],[1,.2]],

function profAt(pr,t){for(let i=1;i<pr.length;i++){if(t<=pr[i][0]){const [t0,v0]=pr[i-1],[t1,v1]=pr[i],u=(t-t0)/(t1-t0),w=(1-Math.cos(Math.PI*u))/2;return v0+(v1-v0)*w}}return pr[pr.length-1][1]}
let FSEQ=0;
function fishSVG(sci,width){
 const f=FDRAW[sci];if(!f)return"";const X0=14,X1=182,Hh=f.h*100,cy=Hh+22,pr=PROF[f.p].slice();
 if(f.snout==="point"){pr[0]=[0,.02];pr[1]=[pr[1][0]*1.6,pr[1][1]*.7]}
 const hh=x=>Hh*profAt(pr,Math.min(1,Math.max(0,(x-X0)/(X1-X0))));
 const top=x=>cy-hh(x),bot=x=>cy+hh(x)*.9;
 const up=[],dn=[];for(let x=X0;x<=X1;x+=2){up.push(`${x},${top(x).toFixed(1)}`);dn.unshift(`${x},${bot(x).toFixed(1)}`)}
 const body=`M${up.join(" L")} L${dn.join(" L")} Z`;
 const id="fg"+(++FSEQ),[ct,cb,cf]=f.c,ped=hh(X1),tH=Math.max(30,Math.min(70,Hh*1.25));
 const notch={fork:X1+13,fork2:X1+20,deep:X1+8,emarg:X1+24}[f.tail];
 const tail=`M${X1-2},${(cy-ped).toFixed(1)} L${X1+32},${(cy-tH/2).toFixed(1)} L${notch},${cy} L${X1+32},${(cy+tH/2).toFixed(1)} L${X1-2},${(cy+ped*.9).toFixed(1)} Z`;
 const fin=(arr,isTop)=>arr.map(([a,b,h,sp])=>{const base=x=>isTop?top(x)+1:bot(x)-1,sg=isTop?-1:1,pts=[];
   if(sp){for(let x=a;x<=b;x+=5){const k=1-.55*(x-a)/(b-a);pts.push(`${x},${(base(x)+sg*h*k*((x-a)%10<5?1:.6)).toFixed(1)}`)}}
   else{const xa=a+(b-a)*.18;pts.push(`${xa.toFixed(1)},${(base(xa)+sg*h).toFixed(1)}`,`${b},${(base(b)+sg*h*.35).toFixed(1)}`)}
   return `<path d="M${a},${base(a).toFixed(1)} L${pts.join(" L")} L${b},${base(b).toFixed(1)} Z" fill="${cf}" opacity=".9"/>`}).join("");
 let mk="";const has=k=>f.m.includes(k);
 const bars=(n,op)=>{let s="";for(let i=0;i<n;i++){const x=48+i*(130/n);s+=`<rect x="${x.toFixed(1)}" y="0" width="${n>10?2.6:3.6}" height="${cy*2+20}" fill="#2B333A" opacity="${op}"/>`}return s};
 if(has("bars9"))mk+=bars(9,.28);if(has("bars14"))mk+=bars(14,.4);if(has("fbars"))mk+=bars(10,.14);
 if(has("saddle"))mk+=`<ellipse cx="170" cy="${cy}" rx="7" ry="${(hh(170)*1.1).toFixed(1)}" fill="#151A1E"/>`;
 if(has("stripes")||has("lines"))[-.45,-.15,.15,.45].forEach(k=>mk+=`<line x1="30" x2="182" y1="${(cy+Hh*k).toFixed(1)}" y2="${(cy+Hh*k*.6).toFixed(1)}" stroke="#2B333A" stroke-width="${has("lines")?1:1.6}" opacity="${has("lines")?.18:.32}"/>`);
 if(has("wavy"))[.25,.5,.72].forEach(k=>{const y0=cy+Hh*k;let d=`M40 ${y0.toFixed(1)}`;for(let x=50;x<=170;x+=10)d+=` Q${x-5} ${(y0+((x/10)%2?3:-3)).toFixed(1)} ${x} ${y0.toFixed(1)}`;mk+=`<path d="${d}" fill="none" stroke="#E2C36B" stroke-width="1.6" opacity=".9"/>`});
 if(has("gold"))mk+=`<path d="M${f.ex-7} ${(cy-Hh*.62).toFixed(1)} Q${f.ex+1} ${(cy-Hh*.5).toFixed(1)} ${f.ex+7} ${(cy-Hh*.68).toFixed(1)}" fill="none" stroke="#E9B44C" stroke-width="4" stroke-linecap="round"/>`;
 if(has("oper"))mk+=`<ellipse cx="50" cy="${(cy-Hh*.42).toFixed(1)}" rx="4" ry="5" fill="#1E2429" opacity=".75"/>`;
 if(has("operB"))mk+=`<ellipse cx="48" cy="${(cy-Hh*.2).toFixed(1)}" rx="3.5" ry="5" fill="#1E2429" opacity=".55"/>`;
 if(has("pec"))mk+=`<ellipse cx="54" cy="${(cy+Hh*.12).toFixed(1)}" rx="4" ry="4.5" fill="#111"/>`;
 if(has("wavyLL")){let d=`M44 ${(cy-Hh*.35).toFixed(1)}`;[[70,cy-Hh*.6,95,cy-Hh*.12],[120,cy+Hh*.25,150,cy+Hh*.02],[170,cy-Hh*.1,182,cy]].forEach(([x1,y1,x2,y2])=>d+=` Q${x1} ${y1.toFixed(1)} ${x2} ${y2.toFixed(1)}`);mk+=`<path d="${d}" fill="none" stroke="#2B333A" stroke-width="2" opacity=".55"/>`}
 if(has("yellow"))mk+=`<line x1="22" x2="182" y1="${(cy-Hh*.05).toFixed(1)}" y2="${cy}" stroke="#E7C04A" stroke-width="3" opacity=".9"/>`;
 const gill=`<path d="M46 ${(top(46)+3).toFixed(1)} Q54 ${cy} 46 ${(bot(46)-3).toFixed(1)}" fill="none" stroke="#1E2429" stroke-width="1.2" opacity=".35"/>`;
 const mouth={small:`<path d="M${X0+1} ${cy+2} l7 1" stroke="#1E2429" stroke-width="1.3"/>`,mid:`<path d="M${X0} ${cy+1} l12 3" stroke="#1E2429" stroke-width="1.4"/>`,big:`<path d="M${X0-1} ${cy} l17 5" stroke="#1E2429" stroke-width="1.6"/>`,
  barra:`<path d="M${X0-7} ${cy+2} L${X0+3} ${cy-1.5} L${X0+3} ${cy+4} Z" fill="${ct}"/><path d="M${X0-7} ${cy+2} l26 2" stroke="#1E2429" stroke-width="1.3"/>`}[f.mouth];
 const py=cy+Hh*.18,pect=`<ellipse cx="62" cy="${py.toFixed(1)}" rx="12" ry="4.5" transform="rotate(18 62 ${py.toFixed(1)})" fill="${cf}" opacity=".85"/>`;
 const pv=Math.max(7,Hh*.3),pelv=`<path d="M70 ${(bot(70)-1).toFixed(1)} l6 ${pv.toFixed(1)} l8 ${(-pv).toFixed(1)} Z" fill="${cf}" opacity=".85"/>`;
 const ey=cy-Hh*.25,H=cy*2+2;
 return `<svg viewBox="-10 0 236 ${H.toFixed(0)}" width="${width}" class="fishpic" aria-hidden="true"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ct}"/><stop offset=".55" stop-color="${cb}"/><stop offset="1" stop-color="${cb}"/></linearGradient><clipPath id="${id}c"><path d="${body}"/></clipPath></defs><path d="${tail}" fill="${cf}"/>${fin(f.d,true)}${fin(f.a,false)}${pelv}<path d="${body}" fill="url(#${id}g)" stroke="#2B333A" stroke-opacity=".35"/><g clip-path="url(#${id}c)">${mk}${gill}</g>${pect}${mouth}<circle cx="${f.ex}" cy="${ey.toFixed(1)}" r="${f.er}" fill="#fff" stroke="#2B333A" stroke-width=".8"/><circle cx="${f.ex-1}" cy="${ey.toFixed(1)}" r="${(f.er*.55).toFixed(1)}" fill="#111"/></svg>`;
}

// ================= astronomy (SunCalc method) =================
const rad=Math.PI/180,dayMs=864e5,J1970=2440588,J2000=2451545,EPS=rad*23.4397;
const toJ=d=>d.valueOf()/dayMs-.5+J1970, fromJ=j=>new Date((j+.5-J1970)*dayMs), toDays=d=>toJ(d)-J2000;
function sunTimes(date,lat,lon){
 const lw=rad*-lon,phi=rad*lat,d=toDays(date),n=Math.round(d-.0009-lw/(2*Math.PI)),ds=.0009+lw/(2*Math.PI)+n;
 const M=rad*(357.5291+.98560028*ds),C=rad*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M)),L=M+C+rad*102.9372+Math.PI;
 const dec=Math.asin(Math.sin(EPS)*Math.sin(L)),Jn=J2000+ds+.0053*Math.sin(M)-.0069*Math.sin(2*L);
 const w=Math.acos((Math.sin(-.833*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
 const a=.0009+(w+lw)/(2*Math.PI)+n,Js=J2000+a+.0053*Math.sin(M)-.0069*Math.sin(2*L);
 return {rise:fromJ(Jn-(Js-Jn)),set:fromJ(Js)};
}
function moonAlt(date,lat,lon){
 const lw=rad*-lon,phi=rad*lat,d=toDays(date);
 const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.229350*d);
 const l=L+rad*6.289*Math.sin(M),b=rad*5.128*Math.sin(F);
 const ra=Math.atan2(Math.sin(l)*Math.cos(EPS)-Math.tan(b)*Math.sin(EPS),Math.cos(l));
 const dec=Math.asin(Math.sin(b)*Math.cos(EPS)+Math.cos(b)*Math.sin(EPS)*Math.sin(l));
 const H=rad*(280.16+360.9856235*d)-lw-ra;
 return Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
}
const SYN=29.530588853;
function moonPhase(t){const jd=t.valueOf()/dayMs+2440587.5;let p=((jd-2451550.1)/SYN)%1;if(p<0)p+=1;return p}
function moonEvents(from,to){
 const ev={rise:[],set:[],over:[],under:[]},step=10*60000,h0=.0023;
 let tP=new Date(from-step),aP=moonAlt(tP,32.1,34.8),tC=new Date(+from),aC=moonAlt(tC,32.1,34.8);
 for(let t=+from+step;t<=+to;t+=step){
  const tN=new Date(t),aN=moonAlt(tN,32.1,34.8);
  if(aP<h0&&aC>=h0)ev.rise.push(tC); if(aP>=h0&&aC<h0)ev.set.push(tC);
  if(aC>aP&&aC>=aN)ev.over.push(tC); if(aC<aP&&aC<=aN)ev.under.push(tC);
  tP=tC;aP=aC;tC=tN;aC=aN;
 }
 return ev;
}
const minDist=(t,arr)=>arr.reduce((m,x)=>Math.min(m,Math.abs(t-x)/6e4),1e9);

// ================= data =================
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function loadSpot(s){
 const c="past_days=2&forecast_days=4&timezone=GMT";
 const W=getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,precipitation,cloud_cover,weather_code&wind_speed_unit=kmh&${c}`);
 const M=getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${s.slat}&longitude=${s.slon}&hourly=wave_height,wave_direction,wave_period,sea_surface_temperature&${c}`).catch(()=>null);
 const Tl=getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${s.slat}&longitude=${s.slon}&hourly=sea_level_height_msl&${c}`).catch(()=>null);
 const [w,m,t]=await Promise.all([W,M,Tl]);return {w,m,t};
}
function align(times,src,key){
 if(!src||!src.hourly||!src.hourly[key])return times.map(()=>null);
 const idx={};src.hourly.time.forEach((s,i)=>idx[s]=i);
 return times.map(s=>{const i=idx[s];const v=i==null?null:src.hourly[key][i];return v==null?null:v});
}
function build(ts,v){const {w,m,t}=v;
 return {wind:align(ts,w,"wind_speed_10m"),dir:align(ts,w,"wind_direction_10m"),gust:align(ts,w,"wind_gusts_10m"),pres:align(ts,w,"pressure_msl"),
  rain:align(ts,w,"precipitation"),cloud:align(ts,w,"cloud_cover"),code:align(ts,w,"weather_code"),wave:align(ts,m,"wave_height"),wper:align(ts,m,"wave_period"),
  sst:align(ts,m,"sea_surface_temperature"),sea:align(ts,t,"sea_level_height_msl")};}
async function loadAll(){
 $("banner").innerHTML=`<div class="banner">${tx().loading}</div>`;
 const list=allSpots();
 try{
  const res=await Promise.allSettled(list.map(loadSpot));
  const first=res.find(r=>r.status==="fulfilled");
  if(!first)throw new Error("no data");
  const ts=first.value.w.hourly.time,store={};
  res.forEach((r,k)=>{if(r.status==="fulfilled")store[list[k].id]=build(ts,r.value)});
  ss("sdp-cache",{at:Date.now(),ts,store});
  setData(ts,store,Date.now(),false);
 }catch(e){
  const c=ls("sdp-cache",null);
  if(c&&Date.now()-c.at<36*3600e3){setData(c.ts,c.store,c.at,true)}
  else{LOADED=null;$("app").hidden=true;$("banner").innerHTML=`<div class="banner err">${tx().err}</div>`;renderOffline()}
 }
}
function setData(ts,store,at,cached){
 TIMES=ts.map(s=>new Date(s+"Z"));TS=ts;D=store;LOADED={at,cached};
 const now=Date.now();NOW=0;TIMES.forEach((t,i)=>{if(+t<=now)NOW=i});
 if(!D[S.spot])S.spot=Object.keys(D)[0];
 S.sel=NOW;applyHash();
 MOON=moonEvents(new Date(+TIMES[0]-dayMs),new Date(+TIMES[TIMES.length-1]+dayMs));
 $("banner").innerHTML=cached?`<div class="banner">${tx().cached} ${fmtDT(new Date(at))}</div>`:"";
 $("app").hidden=false;$("moonOffline").hidden=true;render();
}

// ================= scoring =================
function clarityAt(s,i){
 const d=D[s.id];let h=0,r=0;
 for(let k=Math.max(0,i-36);k<=i;k++)h=Math.max(h,d.wave[k]||0);
 for(let k=Math.max(0,i-48);k<=i;k++)r+=d.rain[k]||0;
 const v=h*.9+r/8+s.turb;
 let c=v<.55?0:v<1.15?1:v<1.9?2:3;
 if(S.clarO!=null&&Math.abs(i-NOW)<=12)c=S.clarO;
 return c;
}
function lightAt(i,cloud){
 const t=TIMES[i],st=sunTimes(t,32.1,34.8),m=Math.min(Math.abs(t-st.rise),Math.abs(t-st.set))/6e4;
 if(m<=90)return "golden"; if(t<st.rise||t>st.set)return "night"; return (cloud!=null&&cloud>=70)?"overcast":"day";
}
function evalAt(s,i,raw){
 const d=D[s.id],F={},warns=[];let unsafe=false;
 const wv=d.wave[i];
 if(wv==null)F.waves={p:11,m:22,st:"na"};
 else if(wv<.2)F.waves={p:12,m:22,st:"flat"};else if(wv<.4)F.waves={p:18,m:22,st:"small"};
 else if(wv<=1)F.waves={p:22,m:22,st:"ideal"};else if(wv<=1.3)F.waves={p:14,m:22,st:"rough"};
 else if(wv<=1.7)F.waves={p:6,m:22,st:"high"};else{F.waves={p:0,m:22,st:"danger"};unsafe=true}
 const w=d.wind[i]||0,g=d.gust[i]||0;
 if(w<=12)F.wind={p:13,m:13,st:"calm"};else if(w<=20)F.wind={p:10,m:13,st:"moderate"};else if(w<=30)F.wind={p:6,m:13,st:"fresh"};
 else if(w<=40)F.wind={p:2,m:13,st:"strong"};else{F.wind={p:0,m:13,st:"danger"};unsafe=true}
 if(g>=60)unsafe=true;
 const dir=d.dir[i]||0,diff=Math.abs(((dir-s.sea+540)%360)-180),on=Math.cos(diff*rad);
 if(w<8)F.dir={p:10,m:10,st:"light"};
 else F.dir={p:Math.round(10-7*Math.max(0,on)*Math.min(1,w/25)),m:10,st:on>.5?"onshore":on<-.5?"offshore":"cross"};
 const tr=presTrend(d,i);
 F.pres={p:{fallslow:12,steady:9,riseslow:7,risefast:4,fallfast:6}[tr],m:12,st:tr};
 const lt=lightAt(i,d.cloud[i]);
 F.light={p:{golden:15,night:10,overcast:10,day:6}[lt],m:15,st:lt};
 const t=TIMES[i],ph=moonPhase(t),near=Math.min(ph*SYN,(1-ph)*SYN,Math.abs(ph-.5)*SYN);
 const major=minDist(t,MOON.over.concat(MOON.under))<=60,minor=minDist(t,MOON.rise.concat(MOON.set))<=30;
 F.moon={p:(near<=3?4:2)+(major?6:minor?4:1),m:10,st:major?"major":minor?"minor":"none",peak:near<=3};
 const c=clarityAt(s,i);
 F.clar={p:[6,10,7,2][c],m:10,st:["clear","slight","murky","muddy"][c],lvl:c};
 const sea=d.sea;
 if(sea[i]==null)F.tide={p:3,m:5,st:"na"};
 else{let mx=0;for(let k=Math.max(1,i-24);k<Math.min(sea.length-1,i+24);k++)if(sea[k+1]!=null&&sea[k-1]!=null)mx=Math.max(mx,Math.abs(sea[k+1]-sea[k-1]));
  const r=(sea[i+1]!=null&&sea[i-1]!=null)?Math.abs(sea[i+1]-sea[i-1]):0;
  F.tide=(mx>0&&r>.35*mx)?{p:5,m:5,st:"moving"}:{p:2,m:5,st:"slack"}}
 const sst=d.sst[i];
 F.sst=sst==null?{p:2,m:3,st:"na"}:(sst>=16&&sst<=28?{p:3,m:3,st:"ok"}:{p:1,m:3,st:"off"});
 if(d.code[i]!=null&&d.code[i]>=95)unsafe=true;
 let total=Object.values(F).reduce((a,f)=>a+f.p,0),tune=null;
 if(!raw){tune=tuneFor(F);if(tune)total+=tune.v}
 total=Math.max(0,Math.min(100,Math.round(total)));
 return {total,F,unsafe,tune};
}
// ---------- learning from the catch log ----------
function learnStats(){
 const log=ls("sdp-log",[]),snap=log.filter(e=>e.st),fishOf=e=>Math.min(10,e.count||0);
 const avg=snap.length?snap.reduce((a,e)=>a+fishOf(e),0)/snap.length:0,st={};
 snap.forEach(e=>Object.entries(e.st).forEach(([k,v])=>{st[k]=st[k]||{};const o=st[k][v]=st[k][v]||{n:0,f:0};o.n++;o.f+=fishOf(e)}));
 return {log,snap,avg,st,fishOf,on:ls("sdp-tune",true)};
}
function tuneFor(F){
 const L=LEARN;if(!L||!L.on||L.snap.length<5||L.avg<=0)return null;
 let v=0,top=null,tb=0;
 Object.entries(F).forEach(([k,f])=>{const o=L.st[k]&&L.st[k][f.st];if(!o||o.n<2)return;
  const rate=(o.f+L.avg*2)/(o.n+2),b=Math.max(-.4*f.m,Math.min(.4*f.m,(rate/L.avg-1)*f.m*.6));
  v+=b;if(Math.abs(b)>Math.abs(tb)){tb=b;top=k}});
 v=Math.max(-15,Math.min(15,v));
 return Math.abs(v)<.5?null:{v:Math.round(v),top};
}
function presTrend(d,i){
 const p=d.pres;if(i<3||p[i]==null||p[i-3]==null)return "steady";
 const dp=p[i]-p[i-3];
 return dp<=-2?"fallfast":dp<=-.5?"fallslow":dp>=2?"risefast":dp>=.5?"riseslow":"steady";
}
const scoreCol=v=>v>=60?"green":v>=40?"yellow":"red";
const level=v=>v>=70?3:v>=55?2:v>=40?1:0;

// ================= charts =================
const BW=6;
function axis(start,end,H,bot){
 let s="";
 for(let i=start;i<=end;i++){const x=(i-start)*BW,h=hourOf(TIMES[i]);
  if(h===0){s+=`<line x1="${x}" x2="${x}" y1="4" y2="${H-bot}" class="grid"/><text x="${x+2}" y="${H-3}" class="dl">${esc(fmtD(TIMES[i]))}</text>`}
  else if(h%6===0)s+=`<text x="${x+BW/2}" y="${H-12}" class="hl" text-anchor="middle">${String(h).padStart(2,"0")}</text>`}
 return s;
}
function marks(start,end,H,bot){
 let s="";
 if(S.sel>=start&&S.sel<=end)s+=`<rect class="selb" x="${(S.sel-start)*BW}" y="0" width="${BW}" height="${H-bot}"/>`;
 if(NOW>=start&&NOW<=end)s+=`<line class="nowl" x1="${(NOW-start)*BW+BW/2}" x2="${(NOW-start)*BW+BW/2}" y1="0" y2="${H-bot}"/>`;
 for(let i=start;i<=end;i++)s+=`<rect class="hit" data-i="${i}" x="${(i-start)*BW}" y="0" width="${BW}" height="${H}"/>`;
 return s;
}
function win(){const start=NOW,end=Math.min(TIMES.length-1,NOW+71);return [start,end]}
function barChart(vals,min,max,colorFn,H=120){
 const [a,b]=win(),W=(b-a+1)*BW,bot=24,ph=H-bot-6;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}">`+axis(a,b,H,bot);
 for(let i=a;i<=b;i++){const v=vals[i];if(v==null)continue;const hh=Math.max(1,(Math.min(max,Math.max(min,v))-min)/(max-min)*ph);
  s+=`<rect x="${(i-a)*BW+.6}" y="${H-bot-hh}" width="${BW-1.2}" height="${hh}" rx="1" fill="${col(colorFn(v,i))}"/>`}
 return s+marks(a,b,H,bot)+"</svg>";
}
function lineChart(vals,min,max,colorFn,H=120,extra=""){
 const [a,b]=win(),W=(b-a+1)*BW,bot=24,ph=H-bot-14,y=v=>H-bot-(Math.min(max,Math.max(min,v))-min)/(max-min)*ph;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}">`+axis(a,b,H,bot),pts=[];
 for(let i=a;i<=b;i++)if(vals[i]!=null)pts.push(`${(i-a)*BW+BW/2},${y(vals[i]).toFixed(1)}`);
 s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.2"/>`;
 for(let i=a;i<=b;i+=2)if(vals[i]!=null)s+=`<circle cx="${(i-a)*BW+BW/2}" cy="${y(vals[i])}" r="2.2" fill="${col(colorFn(vals[i],i))}"/>`;
 return s+extra+marks(a,b,H,bot)+"</svg>";
}
function arrowSVG(dir,size,color){
 // points where the wind blows TO
 return `<svg width="${size}" height="${size}" viewBox="-10 -10 20 20" aria-hidden="true"><g transform="rotate(${(dir+180)%360})"><path d="M0 -8 L5 3 L1 1.5 L1 8 L-1 8 L-1 1.5 L-5 3 Z" fill="${color}"/></g></svg>`;
}
function arrowRow(d){
 const [a,b]=win(),W=(b-a+1)*BW,H=22;let s=`<svg class="ch arrowrow" viewBox="0 0 ${W} ${H}">`;
 for(let i=a;i<=b;i+=3){if(d.dir[i]==null)continue;const x=(i-a)*BW+BW/2;

 $("rigPanel").innerHTML=`<h2>🪝 ${t.rigsT}</h2>`+Object.entries(RIGS).map(([id,r])=>`<details class="rig" id="rig-${id}"><summary>${esc(r.n[L])}</summary>${rigSVG(id)}<ol>${r.steps[L].map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="small">${t.rigFor}: ${esc(FISH.filter(f=>f.rig===id).map(f=>f.n[L]).join(sep))}</p></details>`).join("")+`<p class="small" style="margin-top:8px">${t.rigNote}</p>`}
function renderRules(){const t=tx(),L=LI[S.lang];
 $("rulesPanel").innerHTML=`<h2>⚖️ ${t.rulesT}</h2><div class="rules"><ul>${t.rules.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
 <h3 style="font-size:.95rem;margin:14px 0 6px">${t.sizesT}</h3><table class="tbl">${SIZES.map(r=>`<tr><td>${esc(r.n[L]||r.n[0])}<br><i>${esc(r.sci)}</i></td><td><span class="n">${r.min} cm</span></td></tr>`).join("")}</table>
 <p class="small" style="margin-top:8px">${t.noMinNote}</p><p class="small">${t.mapReserves}</p>
 <p class="small">${t.srcT}<br><a href="https://www.gov.il/BlobFolder/legalinfo/fishing_regulations_2025/en/fish_Israel%20Fishing%20Regulation%20-%202020%20update.pdf" target="_blank" rel="noopener">gov.il</a> · <a href="https://static.parks.org.il/wp-content/uploads/2018/10/INFO-GUIDE-FISHING-ISRAEL.pdf" target="_blank" rel="noopener">parks.org.il</a> · <a href="https://www.govmap.gov.il" target="_blank" rel="noopener">govmap.gov.il</a></p>`}
const appURL=()=>/^https?:$/.test(location.protocol)?location.href.split("#")[0]:"";
async function shareText(text,files){
 try{if(files&&navigator.canShare&&navigator.canShare({files})){await navigator.share({text,files});return}
  if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==="AbortError")return}
 window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener");
}
function shareScore(){const spot=spotById(S.spot),d=D[spot.id],i=S.sel,r=evalAt(spot,i),t=tx();
 const lb=r.unsafe?t.danger:t.lv[level(r.total)],wv=d.wave[i]!=null?d.wave[i].toFixed(1):"–",u=appURL();
 shareText(t.shareScore(nm(spot),fmtDT(TIMES[i]),r.total,lb,wv,Math.round(d.wind[i]||0),dirName(d.dir[i]||0))+(u?`\n${u}#s=${spot.id}&h=${+TIMES[i]}`:""))}
function shareCatch(id){const e=ls("sdp-log",[]).find(x=>String(x.id)===String(id));if(!e)return;
 const t=tx(),L=LI[S.lang],s=spotById(e.spot),sn=s?nm(s):e.name,dt=fmtDM(new Date(e.t)),fn=e.fish===99?t.other:(FISH[e.fish]?FISH[e.fish].n[L]:t.other),u=appURL();
 const text=(e.fish===-1?t.shareNo(sn,dt):t.shareCatch(fn,e.count,e.len,sn,dt))+(u?"\n"+u:"");
 const b=PHBLOB[e.id];shareText(text,b?[new File([b],"catch.jpg",{type:"image/jpeg"})]:null)}
let HASHED=false;
function applyHash(){if(HASHED)return;HASHED=true;const h=new URLSearchParams(location.hash.slice(1)),sp=h.get("s"),tm=+h.get("h");
 if(sp&&spotById(sp))S.spot=sp;
 if(tm){let bi=-1,bd=1e15;TIMES.forEach((x,k)=>{const dd=Math.abs(x-tm);if(dd<bd){bd=dd;bi=k}});if(bi>=NOW&&bd<=36e5)S.sel=bi}}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;renderInstall()});
const isStandalone=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
function renderInstall(){const c=$("installCard");if(!c)return;
 if(isStandalone()||ls("sdp-inst",false)||!appURL()){c.innerHTML="";return}
 c.innerHTML=`<div class="banner">📲 ${deferredPrompt?tx().installA:tx().installI}<div class="chips">${deferredPrompt?`<button class="chip" id="instBtn">${tx().installBtn}</button>`:""}<button class="chip" id="instX">${tx().dismiss}</button></div></div>`}

// ================= tabs & fish guide =================
function renderTabbar(){const ic=["📊","🗺️","📒","📘"],ids=["today","map","log","guide"];
 const tb=$("tabbar");tb.hidden=false;tb.innerHTML=ids.map((id,k)=>`<button role="tab" data-tab-btn="${id}" aria-selected="${S.tab===id}"><span aria-hidden="true">${ic[k]}</span>${esc(tx().tabs[k])}</button>`).join("")}
function showTab(t){S.tab=t;ss("sdp-tab",t);if(LOADED)document.body.dataset.tab=t;renderTabbar();window.scrollTo(0,0);
 if(t==="map"&&LM)setTimeout(()=>{LM.invalidateSize();if(!LMfit){LM.fitBounds([[31.62,34.5],[33.08,35.12]]);LMfit=true}},60)}
function renderSpotSel(){$("spotSelL").textContent=tx().beachL;
 $("spotSel").innerHTML=allSpots().filter(s=>D[s.id]).map(s=>`<option value="${esc(s.id)}"${s.id===S.spot?" selected":""}>${esc(nm(s))}</option>`).join("")}
function renderFishGuide(){const t=tx(),L=LI[S.lang];
 $("fishGuide").innerHTML=`<h2>🐟 ${t.fishGuideT}</h2><p class="small">${t.drawNote}</p>`+FISH.map(f=>`<div class="fg2"><div class="pic">${fishSVG(f.sci,300)}</div>
  <h3>${esc(f.n[L])} <i>${esc(f.sci)}</i></h3><p class="id">🔎 ${esc(FID[f.sci][L])}</p>
  <div class="small">🎣 ${t.bait}: ${esc(f.b[L])}</div>
  <div class="small">📏 ${esc(f.min?t.minSize(f.min):t.noMin)} · <button class="linkbtn" data-rig="${f.rig}">🪝 ${esc(RIGS[f.rig].n[L])}</button> · <a href="https://en.wikipedia.org/wiki/${WIKI[f.sci]}" target="_blank" rel="noopener">${t.photosLink}</a></div>
  ${f.note?`<div class="note">⚠ ${esc(f.note[L])}</div>`:""}</div>`).join("")}

// ================= events =================
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.lang=b.dataset.l;ss("sdp-lang",S.lang);
 if(LOADED&&LOADED.cached)$("banner").innerHTML=`<div class="banner">${tx().cached} ${fmtDT(new Date(LOADED.at))}</div>`;
 else if(!LOADED&&$("banner").innerHTML)$("banner").innerHTML=`<div class="banner err">${tx().err}</div>`;
 render()});
document.addEventListener("click",e=>{
 const q=sel=>e.target.closest(sel);
 if(q("#vClose")||e.target.id==="viewer"){$("viewer").hidden=true;return}
 const shr=q("[data-share]");if(shr){shareCatch(shr.dataset.share);return}
 const th=q("img[data-ph]");if(th){openViewer(th.dataset.ph);return}
 if(q("#shareScore")){shareScore();return}
 const rg=q("[data-rig]");if(rg){showTab("guide");const dd=$("rig-"+rg.dataset.rig);if(dd){dd.open=true;dd.scrollIntoView({behavior:"smooth",block:"start"})}return}
 if(q("#instBtn")&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderInstall()});return}
 if(q("#instX")){ss("sdp-inst",true);renderInstall();return}
 if(q("#gpsBtn")){nearest();return}
 if(q("#addSpotBtn")){if(!LM){useLoc();return}addMode=!addMode;pendingSpot=null;mapMsg="";render();return}
 if(q("#useLocBtn")){useLoc();return}
 if(q("#layerBtn")){toggleLayer();return}
 const ty=q("[data-ty]");if(ty&&pendingSpot){pendingSpot.type=ty.dataset.ty;renderMapTools();return}
 if(q("#sSave")){saveSpot();return}
 if(q("#sCancel")){pendingSpot=null;mapMsg="";render();return}
 if(q("#delSpot")){deleteSpot();return}
 if(q("#logOpen")){openLog(S.spot,Date.now());return}
 if(q("#logHere")){showTab("log");openLog(S.spot,+TIMES[S.sel]);$("logPanel").scrollIntoView({behavior:"smooth",block:"start"});return}
 if(q("#logCancel")){logOpen=false;logPre=null;renderLog();return}
 if(q("#logSave")){saveTrip();return}
 const dl=q("[data-del]");if(dl){const id=Number(dl.dataset.del);ss("sdp-log",ls("sdp-log",[]).filter(x=>Number(x.id)!==id));IDB.del(String(id)).catch(()=>{});if(PHURL[id]){URL.revokeObjectURL(PHURL[id]);delete PHURL[id];delete PHBLOB[id]}logMsg="";render();return}
 if(q("#tuneBtn")){ss("sdp-tune",!(LEARN&&LEARN.on));render();return}
 if(q("#expBtn")){exportData();return}
 if(q("#impBtn")){$("impFile").click();return}
 const tb=q("[data-tab-btn]");if(tb){showTab(tb.dataset.tabBtn);return}
 if(q("#goToday")){showTab("today");return}
 const sp=e.target.closest("[data-s]");if(sp){S.spot=sp.dataset.s;ss("sdp-spot",S.spot);showTab("today");render();return}
 const h=e.target.closest("[data-i]");if(h){S.sel=+h.dataset.i;render();return}
 const c=e.target.closest("#clarChips [data-c]");if(c){S.clarO=c.dataset.c===""?null:+c.dataset.c;render();return}
});
$("backNow").onclick=()=>{S.sel=NOW;render()};
$("refresh").onclick=()=>loadAll();
render();loadAll();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
